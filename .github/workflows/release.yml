name: Release
# Every push to main: semantic-release reads Conventional Commits,
# bumps the version, tags vX.Y.Z, publishes @xdev-asia/ui to GitHub Packages, writes a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@xdev-asia"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:dist
      # Pinned and kept out of devDependencies so consumers of the workspace do not install the release toolchain.
      # semantic-release 25 bundles conventional-changelog-writer 8, so the preset must stay on v9 (see 143aa1d).
      - run: npx --yes --package semantic-release@25.0.9 --package conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
